<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina — Tuktuk Copán</title>
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --surface-2: #F1EFE9;
    --line: #E4E0D6;
    --line-strong: #D8D3C7;
    --ink: #23211C;
    --ink-mid: #5F594E;
    --ink-dim: #8C8578;

    --accent: #16704A;
    --accent-bg: #E3F0E9;

    --free: #16704A;      --free-bg: #E3F0E9;
    --busy: #2F5AA8;      --busy-bg: #E4EBF7;
    --rest: #8A6212;      --rest-bg: #F7EEDA;
    --gone: #7A7469;      --gone-bg: #ECEAE4;
    --urgent: #A8331F;    --urgent-bg: #F9E6E2;

    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --shadow: 0 1px 2px rgba(35,33,28,0.06), 0 2px 8px rgba(35,33,28,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16150F;
      --surface: #1F1E18;
      --surface-2: #272620;
      --line: #332F2C;
      --line-strong: #423E36;
      --ink: #EDEAE1;
      --ink-mid: #ABA396;
      --ink-dim: #837C6F;

      --accent: #4FB286;
      --accent-bg: #17342A;

      --free: #4FB286;    --free-bg: #17342A;
      --busy: #7FA3E0;    --busy-bg: #1C2740;
      --rest: #D9A441;    --rest-bg: #33280F;
      --gone: #8C8578;    --gone-bg: #262520;
      --urgent: #E07A63;  --urgent-bg: #3A211B;
      --shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #16150F; --surface: #1F1E18; --surface-2: #272620;
    --line: #332F2C; --line-strong: #423E36;
    --ink: #EDEAE1; --ink-mid: #ABA396; --ink-dim: #837C6F;
    --accent: #4FB286; --accent-bg: #17342A;
    --free: #4FB286; --free-bg: #17342A;
    --busy: #7FA3E0; --busy-bg: #1C2740;
    --rest: #D9A441; --rest-bg: #33280F;
    --gone: #8C8578; --gone-bg: #262520;
    --urgent: #E07A63; --urgent-bg: #3A211B;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2 { margin: 0; font-weight: 700; line-height: 1.2; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface); border-bottom: 1px solid var(--line-strong);
    padding: 0.65rem 1rem; display: flex; align-items: center; gap: 0.85rem; flex-wrap: wrap;
  }
  header h1 { font-size: 1rem; letter-spacing: -0.01em; }
  .live {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.72rem; font-weight: 600; color: var(--ink-dim);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--free);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
  .grow { flex: 1 }

  .tabs { display: flex; gap: 0.25rem; }
  .tabs button {
    font: inherit; font-size: 0.85rem; font-weight: 600;
    background: none; border: none; color: var(--ink-mid);
    padding: 0.35rem 0.75rem; border-radius: 7px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--accent-bg); color: var(--accent); }
  .tabs button:hover { color: var(--ink); }
  .tabs button:focus-visible, a:focus-visible, select:focus-visible, .chip:focus-visible,
  .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { padding: 1rem; max-width: 76rem; margin: 0 auto; }
  section[hidden] { display: none; }

  /* Summary strip */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: 0.6rem; margin-bottom: 1.1rem; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.7rem 0.85rem; box-shadow: var(--shadow);
  }
  .stat .n { font-size: 1.7rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .l {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--ink-dim); margin-top: 0.3rem;
  }
  .stat.alert .n { color: var(--urgent); }

  h2.section-title {
    font-size: 0.74rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-dim); margin: 1.4rem 0 0.6rem;
  }
  h2.section-title:first-of-type { margin-top: 0; }

  .cards { display: grid; gap: 0.6rem; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 0.8rem 0.9rem; box-shadow: var(--shadow);
  }
  /* Severity stripe: waiting time is the thing a dispatcher must not miss. */
  .card.waiting { border-left: 4px solid var(--line-strong); }
  .card.waiting.warn { border-left-color: var(--rest); }
  .card.waiting.late { border-left-color: var(--urgent); background: var(--urgent-bg); }

  .card-top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .route { font-weight: 600; }
  .route .arrow, td .arrow { color: var(--ink-dim); margin: 0 0.3rem; }
  .waited { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.85rem; }
  .waited.warn { color: var(--rest); }
  .waited.late { color: var(--urgent); }
  .sub { color: var(--ink-mid); font-size: 0.82rem; }
  .phone { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-dim); }

  .pill {
    display: inline-block; font-size: 0.66rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.15rem 0.45rem; border-radius: 999px; white-space: nowrap;
  }
  .pill.available { background: var(--free-bg); color: var(--free); }
  .pill.assigned, .pill.on_trip { background: var(--busy-bg); color: var(--busy); }
  .pill.break { background: var(--rest-bg); color: var(--rest); }
  .pill.off { background: var(--gone-bg); color: var(--gone); }

  .assign { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.6rem; }
  .assign .label { font-size: 0.72rem; font-weight: 600; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .chip {
    font: inherit; font-size: 0.83rem; cursor: pointer;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 0.25rem 0.7rem; display: inline-flex; align-items: baseline; gap: 0.35rem;
  }
  .chip:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
  .chip:disabled { opacity: 0.5; cursor: not-allowed; }
  .chip.best { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .chip .eta { font-variant-numeric: tabular-nums; font-size: 0.76rem; opacity: 0.85; }
  .linkbtn {
    font: inherit; font-size: 0.8rem; background: none; border: none;
    color: var(--ink-dim); text-decoration: underline; cursor: pointer; padding: 0.25rem;
  }
  .linkbtn:hover { color: var(--urgent); }

  /* Driver grid */
  .drivers { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.6rem; }
  .driver .name { font-weight: 600; }
  .driver .tuk { color: var(--ink-dim); font-weight: 400; font-size: 0.85rem; }
  .driver .where { margin-top: 0.3rem; font-size: 0.85rem; color: var(--ink-mid); }
  .driver .where .arrow { color: var(--ink-dim); }

  /* Reports */
  .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
  select, .btn {
    font: inherit; font-size: 0.85rem; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 7px; padding: 0.35rem 0.6rem;
    cursor: pointer; text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 0.87rem; }
  th {
    text-align: left; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-dim);
    padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--line-strong); white-space: nowrap;
  }
  td { padding: 0.5rem 0.85rem; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  /* Label columns share the leftover width so numeric columns stay narrow and
     sit beside the values they belong to, instead of drifting apart. */
  th:not(.num), td:not(.num) { width: 100%; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Roster */
  .btn.primary { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .roster-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
  .roster-row .who { min-width: 11rem; }
  .roster-row .meta { color: var(--ink-mid); font-size: 0.85rem; }
  .roster-row .phone { font-size: 0.85rem; }
  .card.inactive { opacity: 0.62; }
  .card.inactive .name { text-decoration: line-through; }

  dialog {
    border: 1px solid var(--line-strong); border-radius: 12px; padding: 0;
    background: var(--surface); color: var(--ink);
    width: min(30rem, 94vw); box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }
  dialog::backdrop { background: rgba(20,18,14,0.45); }
  .dlg-head { padding: 0.85rem 1.1rem; border-bottom: 1px solid var(--line); font-weight: 700; }
  .dlg-body { padding: 1rem 1.1rem; display: grid; gap: 0.9rem; }
  .dlg-foot {
    padding: 0.75rem 1.1rem; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 0.5rem;
  }
  .field { display: grid; gap: 0.25rem; }
  .field > span { font-size: 0.8rem; font-weight: 600; }
  .field > span em { font-weight: 400; font-style: normal; color: var(--ink-dim); }
  .field input, .field select {
    font: inherit; font-size: 0.92rem; padding: 0.45rem 0.6rem;
    border: 1px solid var(--line-strong); border-radius: 7px;
    background: var(--bg); color: var(--ink); width: 100%;
  }
  .field input:focus-visible, .field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field small { color: var(--ink-dim); font-size: 0.76rem; line-height: 1.4; }
  .form-error {
    margin: 0; padding: 0.5rem 0.7rem; border-radius: 7px;
    background: var(--urgent-bg); color: var(--urgent); font-size: 0.85rem;
  }

  .empty { padding: 1.6rem 1rem; text-align: center; color: var(--ink-dim); font-size: 0.88rem; }
  .toast {
    position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 0.55rem 1rem;
    border-radius: 8px; font-size: 0.87rem; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.18s;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none } }
</style>
</head>
<body>

<header>
  <h1>🛺 Oficina</h1>
  <span class="live"><span class="dot"></span> En vivo</span>
  <div class="grow"></div>
  <a class="linkbtn" id="harness-link" href="/harness.html" hidden>Banco de pruebas →</a>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-board" aria-selected="true" aria-controls="view-board">Tablero</button>
    <button role="tab" id="tab-report" aria-selected="false" aria-controls="view-report">Reportes</button>
    <button role="tab" id="tab-roster" aria-selected="false" aria-controls="view-roster">Conductores</button>
  </div>
</header>

<main>
  <section id="view-board" role="tabpanel" aria-labelledby="tab-board">
    <div class="summary" id="summary"></div>

    <h2 class="section-title">Esperando</h2>
    <div class="cards" id="pending"></div>

    <h2 class="section-title">Conductores</h2>
    <div class="drivers" id="drivers"></div>
  </section>

  <section id="view-report" role="tabpanel" aria-labelledby="tab-report" hidden>
    <div class="controls">
      <label for="range" class="sub">Periodo:</label>
      <select id="range">
        <option value="today">Hoy</option>
        <option value="yesterday">Ayer</option>
        <option value="7d">Últimos 7 días</option>
        <option value="30d">Últimos 30 días</option>
      </select>
      <a class="btn" id="csv" href="#" download>⬇ Descargar CSV</a>
    </div>

    <h2 class="section-title">Viajes por conductor</h2>
    <div class="tablewrap"><table id="by-driver"></table></div>

    <h2 class="section-title">Rutas más frecuentes</h2>
    <div class="tablewrap"><table id="flows"></table></div>

    <h2 class="section-title">Descansos</h2>
    <div class="tablewrap"><table id="breaks"></table></div>
  </section>

  <section id="view-roster" role="tabpanel" aria-labelledby="tab-roster" hidden>
    <div class="controls">
      <button class="btn primary" id="add-driver">+ Agregar conductor</button>
      <span class="sub" id="roster-count"></span>
    </div>
    <div class="cards" id="roster"></div>
  </section>
</main>

<dialog id="driver-dialog">
  <form method="dialog" id="driver-form">
    <div class="dlg-head" id="driver-dialog-title">Agregar conductor</div>
    <div class="dlg-body">
      <label class="field">
        <span>Nombre</span>
        <input id="f-name" required autocomplete="off" placeholder="Don José">
      </label>
      <label class="field">
        <span>Teléfono (WhatsApp)</span>
        <input id="f-phone" required autocomplete="off" inputmode="tel" placeholder="9999-0001">
        <small>8 dígitos para Honduras, o el número completo con código de país.
          Debe ser el número desde el que el conductor escribe por WhatsApp.</small>
      </label>
      <label class="field">
        <span>Número de tuktuk <em>(opcional)</em></span>
        <input id="f-tuktuk" autocomplete="off" placeholder="3">
      </label>
      <label class="field">
        <span>Zona habitual</span>
        <select id="f-zone"></select>
        <small>Punto de partida para calcular tiempos. Se corrige solo en cuanto
          empiece a trabajar.</small>
      </label>
      <p class="form-error" id="f-error" role="alert" hidden></p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="f-cancel">Cancelar</button>
      <div class="grow"></div>
      <button type="submit" class="btn primary" id="f-save">Guardar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok && res.status !== 409) throw new Error(`${path} → ${res.status}`);
  return { status: res.status, body: await res.json() };
}

/* ---------------- board ---------------- */

const STATUS_ES = {
  available: "libre", assigned: "asignado", on_trip: "en viaje",
  break: "descanso", off: "fuera",
};

/** Waiting time is the one number a dispatcher must not miss. */
function urgency(min) {
  if (min >= 6) return "late";
  if (min >= 3) return "warn";
  return "";
}

async function refreshBoard() {
  const { body } = await api("/api/board");
  renderSummary(body);
  renderPending(body.pending);
  renderDrivers(body.drivers);
}

function renderSummary({ drivers, pending }) {
  const count = (s) => drivers.filter((d) => d.status === s).length;
  const worst = pending.reduce((m, p) => Math.max(m, p.waitingMin), 0);

  const stats = [
    { n: pending.length, l: "esperando", alert: pending.length > 0 },
    { n: count("available"), l: "libres" },
    { n: count("assigned") + count("on_trip"), l: "en viaje" },
    { n: count("break"), l: "en descanso" },
    { n: pending.length ? `${worst}m` : "—", l: "espera máxima", alert: worst >= 6 },
  ];

  const box = $("summary");
  box.replaceChildren();
  for (const s of stats) {
    const card = el("div", `stat${s.alert ? " alert" : ""}`);
    card.append(el("div", "n", String(s.n)), el("div", "l", s.l));
    box.append(card);
  }
}

function renderPending(pending) {
  const box = $("pending");
  box.replaceChildren();

  if (!pending.length) {
    const e = el("div", "card empty", "Nadie esperando. 🎉");
    box.append(e);
    return;
  }

  for (const p of pending) {
    const u = urgency(p.waitingMin);
    const card = el("div", `card waiting ${u}`.trim());

    const top = el("div", "card-top");
    const route = el("div", "route");
    route.append(
      document.createTextNode(p.pickup_zone_name ?? "—"),
      el("span", "arrow", "→"),
      document.createTextNode(p.dest_label ?? "—"),
    );
    top.append(route, el("span", `waited ${u}`.trim(), `${p.waitingMin} min`));
    card.append(top);

    if (p.customer_phone) card.append(el("div", "phone", p.customer_phone));

    const assign = el("div", "assign");
    assign.append(el("span", "label", "Asignar a"));

    const free = p.suggestions.filter((s) => s.status === "available");
    if (!free.length) {
      assign.append(el("span", "sub", "ningún conductor libre en este momento"));
    } else {
      free.forEach((s, i) => {
        const chip = el("button", `chip${i === 0 ? " best" : ""}`);
        chip.append(document.createTextNode(s.name), el("span", "eta", `${s.etaMin} min`));
        chip.onclick = () => assignTrip(p.id, s.driverId, chip);
        assign.append(chip);
      });
    }

    const cancel = el("button", "linkbtn", "Cancelar");
    cancel.onclick = () => cancelTrip(p.id, p.dest_label ?? "");
    assign.append(cancel);

    card.append(assign);
    box.append(card);
  }
}

function renderDrivers(drivers) {
  const box = $("drivers");
  box.replaceChildren();

  for (const d of drivers) {
    const card = el("div", "card driver");

    const top = el("div", "card-top");
    const name = el("span", "name", d.name);
    if (d.tuktuk_no) name.append(el("span", "tuk", ` #${d.tuktuk_no}`));
    top.append(name, el("span", `pill ${d.status}`, STATUS_ES[d.status] ?? d.status));
    card.append(top);

    const where = el("div", "where");
    if (d.trip_id) {
      where.append(
        document.createTextNode(d.zone_name ?? "—"),
        el("span", "arrow", " → "),
        document.createTextNode(d.trip_dest ?? "—"),
      );
    } else {
      where.textContent = d.zone_name ?? "—";
    }
    card.append(where);
    box.append(card);
  }
}

async function assignTrip(tripId, driverId, chip) {
  chip.disabled = true;
  try {
    const { status } = await api("/api/assign", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tripId, driverId }),
    });
    // 409 means the driver or trip was taken between render and click — the
    // conditional claim rejected it, which is the behavior we want.
    toast(status === 409
      ? "Ese conductor ya fue asignado a otro viaje."
      : "Viaje asignado. Se le avisó al conductor.");
  } catch {
    toast("No se pudo asignar. Intente de nuevo.");
  }
  await refreshBoard();
}

async function cancelTrip(tripId, label) {
  if (!confirm(`¿Cancelar el viaje a ${label}?`)) return;
  try {
    await api("/api/cancel", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tripId }),
    });
    toast("Viaje cancelado.");
  } catch {
    toast("No se pudo cancelar.");
  }
  await refreshBoard();
}

/* ---------------- reports ---------------- */

function rangeFor(key) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const DAY = 86400000;
  if (key === "today") return { from: startOfToday, to: startOfToday + DAY };
  if (key === "yesterday") return { from: startOfToday - DAY, to: startOfToday };
  if (key === "7d") return { from: startOfToday - 6 * DAY, to: startOfToday + DAY };
  return { from: startOfToday - 29 * DAY, to: startOfToday + DAY };
}

/** A sub-minute average is a seeded-data artifact, not a real trip time. */
function formatMinutes(min) {
  if (min === null || min === undefined) return "—";
  return min < 1 ? "< 1 min" : `${min.toFixed(1)} min`;
}

function table(node, headers, rows, renderRow) {
  node.replaceChildren();
  if (!rows.length) {
    const cap = el("caption", "empty", "Sin datos en este periodo.");
    node.append(cap);
    return;
  }
  const thead = el("thead");
  const hr = el("tr");
  for (const h of headers) {
    hr.append(el("th", h.num ? "num" : "", h.label));
  }
  thead.append(hr);
  const tbody = el("tbody");
  for (const r of rows) tbody.append(renderRow(r));
  node.append(thead, tbody);
}

async function refreshReport() {
  const { from, to } = rangeFor($("range").value);
  $("csv").href = `/api/report.csv?from=${from}&to=${to}`;

  const { body } = await api(`/api/report?from=${from}&to=${to}`);

  table(
    $("by-driver"),
    [{ label: "Conductor" }, { label: "Viajes", num: true }, { label: "Banderas", num: true },
     { label: "Duración prom.", num: true }],
    body.byDriver,
    (d) => {
      const tr = el("tr");
      tr.append(
        el("td", "", d.driver ?? "—"),
        el("td", "num", String(d.trips)),
        el("td", "num", String(d.banderas ?? 0)),
        el("td", "num", formatMinutes(d.avg_trip_min)),
      );
      return tr;
    },
  );

  table(
    $("flows"),
    [{ label: "Ruta" }, { label: "Viajes", num: true }],
    body.flows,
    (f) => {
      const tr = el("tr");
      // A route is one fact, not two columns — keeping it in a single cell
      // also stops long zone names from wrapping against a squeezed column.
      const route = el("td");
      route.append(
        document.createTextNode(f.from_zone ?? "—"),
        el("span", "arrow", " → "),
        document.createTextNode(f.to_zone ?? "—"),
      );
      tr.append(route, el("td", "num", String(f.trips)));
      return tr;
    },
  );

  table(
    $("breaks"),
    [{ label: "Conductor" }, { label: "Descansos", num: true }],
    body.breaks,
    (b) => {
      const tr = el("tr");
      tr.append(el("td", "", b.driver ?? "—"), el("td", "num", String(b.breaks)));
      return tr;
    },
  );
}

/* ---------------- driver roster ---------------- */

let zonesCache = [];

async function refreshRoster() {
  const { body } = await api("/api/drivers");
  zonesCache = body.zones;

  const active = body.drivers.filter((d) => d.active);
  $("roster-count").textContent =
    `${active.length} activo${active.length === 1 ? "" : "s"}` +
    (body.drivers.length > active.length
      ? ` · ${body.drivers.length - active.length} desactivado(s)`
      : "");

  const box = $("roster");
  box.replaceChildren();

  if (!body.drivers.length) {
    box.append(el("div", "card empty", "Todavía no hay conductores registrados."));
    return;
  }

  for (const d of body.drivers) {
    const card = el("div", `card${d.active ? "" : " inactive"}`);
    const row = el("div", "roster-row");

    const who = el("div", "who");
    const name = el("div", "name", d.name);
    if (d.tuktuk_no) name.append(el("span", "tuk", ` #${d.tuktuk_no}`));
    who.append(name, el("div", "phone", d.phone_display));
    row.append(who);

    row.append(el("span", "meta", zoneName(d.zone_id)));
    row.append(el("span", `pill ${d.active ? d.status : "off"}`,
      d.active ? (STATUS_ES[d.status] ?? d.status) : "desactivado"));

    row.append(el("div", "grow"));

    const edit = el("button", "linkbtn", "Editar");
    edit.onclick = () => openDriverDialog(d);
    row.append(edit);

    const toggle = el("button", "linkbtn", d.active ? "Desactivar" : "Reactivar");
    toggle.onclick = () => toggleDriver(d);
    row.append(toggle);

    card.append(row);
    box.append(card);
  }
}

function zoneName(id) {
  return zonesCache.find((z) => z.id === id)?.name ?? "—";
}

let editingId = null;

function openDriverDialog(driver) {
  editingId = driver?.id ?? null;
  $("driver-dialog-title").textContent = driver ? "Editar conductor" : "Agregar conductor";
  $("f-name").value = driver?.name ?? "";
  // Editing shows the stored digits, so what is saved is what Meta will send.
  $("f-phone").value = driver?.phone ?? "";
  $("f-tuktuk").value = driver?.tuktuk_no ?? "";

  const zoneSel = $("f-zone");
  zoneSel.replaceChildren();
  for (const z of zonesCache) {
    const opt = el("option", "", z.name);
    opt.value = z.id;
    zoneSel.append(opt);
  }
  zoneSel.value = driver?.zone_id ?? zonesCache[0]?.id ?? "";

  $("f-error").hidden = true;
  $("driver-dialog").showModal();
  $("f-name").focus();
}

async function saveDriver(event) {
  event.preventDefault();
  const payload = {
    name: $("f-name").value,
    phone: $("f-phone").value,
    tuktukNo: $("f-tuktuk").value,
    zoneId: $("f-zone").value,
  };

  const path = editingId ? `/api/drivers/${editingId}` : "/api/drivers";
  const res = await fetch(path, {
    method: editingId ? "PATCH" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({}));

  if (!res.ok) {
    const err = $("f-error");
    err.textContent = body.error ?? "No se pudo guardar.";
    err.hidden = false;
    return;
  }

  $("driver-dialog").close();
  toast(editingId ? "Conductor actualizado." : "Conductor agregado.");
  await refreshRoster();
}

async function toggleDriver(d) {
  const next = !d.active;
  if (!next && !confirm(`¿Desactivar a ${d.name}? Dejará de recibir viajes.`)) return;

  const res = await fetch(`/api/drivers/${d.id}/active`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ active: next }),
  });
  const body = await res.json().catch(() => ({}));

  toast(res.ok
    ? (next ? `${d.name} reactivado.` : `${d.name} desactivado.`)
    : (body.error ?? "No se pudo cambiar el estado."));
  await refreshRoster();
}

$("add-driver").onclick = () => openDriverDialog(null);
$("driver-form").onsubmit = saveDriver;
$("f-cancel").onclick = () => $("driver-dialog").close();

/* ---------------- wiring ---------------- */

let boardTimer;

const TABS = ["board", "report", "roster"];

function showTab(which, push = true) {
  // Keep the tab in the URL so a refresh — or a dispatcher's bookmark — lands
  // back where they were instead of resetting to the board.
  if (push && location.hash !== `#${which}`) history.replaceState(null, "", `#${which}`);

  for (const t of TABS) {
    $(`tab-${t}`).setAttribute("aria-selected", String(t === which));
    $(`view-${t}`).hidden = t !== which;
  }

  // Only the board polls; leaving its timer running under another tab would
  // keep hammering the API for a view nobody is looking at.
  clearInterval(boardTimer);
  if (which === "board") {
    refreshBoard();
    boardTimer = setInterval(() => refreshBoard().catch(() => {}), 5000);
  } else if (which === "report") {
    refreshReport();
  } else {
    refreshRoster();
  }
}

for (const t of TABS) $(`tab-${t}`).onclick = () => showTab(t);
$("range").onchange = () => refreshReport();

// The harness only exists in dev, so only offer the link where it resolves.
fetch("/health")
  .then((r) => r.json())
  .then((h) => { if (h.dev) $("harness-link").hidden = false; })
  .catch(() => {});

function currentTab() {
  const hash = location.hash.slice(1);
  return TABS.includes(hash) ? hash : "board";
}
window.addEventListener("hashchange", () => showTab(currentTab(), false));

showTab(currentTab(), false);
</script>
